name: Zizmor Audit

# Reusable workflow: audits all GitHub Actions workflow files with zizmor.
# Call this from any workflow that has self-hosted runner jobs to gate them
# behind the security audit.

permissions: {}

on:
  workflow_call:

env:
  ZIZMOR_VERSION: "1.20.0"

jobs:
  zizmor:
    name: Audit GitHub Actions
    # Intentionally on ubuntu-latest, not self-hosted: this job gates
    # self-hosted runner jobs, so it must run on a trusted runner to
    # prevent a malicious workflow change from bypassing the audit.
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          # Pin the uv version so setup-uv constructs the release download
          # URL directly. Left unpinned, it resolves the latest release
          # through a GitHub API call at runtime, and an API disruption
          # then fails this job — taking the entire gated pipeline (lint,
          # tests, image builds) down with it.
          version: "0.11.29"
      - name: Run zizmor (SARIF)
        if: always()
        # Pin zizmor for the same reason uv is pinned above: left unpinned,
        # `uvx` takes whatever is newest at run time, so a release that adds
        # an audit turns this gate red without anything in the repo changing.
        # 1.24.0 added `ref-version-mismatch`, which flags all 39 of our hash
        # pins whose trailing version comment is coarser than the tag the
        # commit belongs to (`# v4` against a commit tagged v4.3.1). To
        # unpin, correct those comments first, then raise this version.
        run: uvx zizmor@${{ env.ZIZMOR_VERSION }} --config .github/zizmor.yml --format=sarif .github/workflows/ > results.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdefb33c0f6224e58673d9004f47f7cb3e328b89 # v4.31.10
        with:
          sarif_file: results.sarif
          category: zizmor
      - name: Run zizmor (audit)
        run: uvx zizmor@${{ env.ZIZMOR_VERSION }} --config .github/zizmor.yml .github/workflows/
